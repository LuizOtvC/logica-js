<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconto em %</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="desconto">
        <h1> Desconto</h1>

        <label for="preco">Preço</label>
        <input type="number" id="preco" step="0.1">

        <label for="desconto">% do desconto</label>
        <input type="number" id="desconto" step="0.1">

        <button id="converter">Converter</button>

        <p id="resultado" class="resultado">O resultado aparece aqui.</p>
        
    </main>
    <script src="..\aula06\js\desconto.js"></script>

    
</body>
</html>
